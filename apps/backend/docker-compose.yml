services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/index.js"]
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
    restart: unless-stopped

volumes:
  redis-data: